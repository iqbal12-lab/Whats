<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp - Bal</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; background-color: #ece5dd; }
        .header { background: #075E54; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; z-index: 10; }
        .header-icons button { background: none; border: none; color: white; font-size: 22px; margin-left: 20px; cursor: pointer; }
        
        /* Background disesuaikan dengan foto image_2.png */
        .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: url('image_2.png'); background-size: cover; background-position: center; background-attachment: fixed; }
        
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 10px; font-size: 15px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; }
        .msg.me { align-self: flex-end; background: #dcf8c6; border-top-right-radius: 0; }
        .msg.them { align-self: flex-start; background: #ffffff; border-top-left-radius: 0; }
        .msg-time { font-size: 10px; color: #888; display: block; text-align: right; margin-top: 5px; }
        
        .input-area { display: flex; padding: 12px; background: #f0f0f0; align-items: center; gap: 10px; }
        .input-area input { flex: 1; padding: 12px 15px; border-radius: 25px; border: none; outline: none; font-size: 15px; }
        .input-area button { background: #008069; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; }

        /* Layar Telepon */
        #callScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; }
        #jitsiFrame { width: 100%; height: 100%; border: none; }
        .end-call-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: #ff3b30; color: white; padding: 15px 30px; border-radius: 30px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div class="header">
        <div>👤 Dai</div>
        <div class="header-icons">
            <button onclick="startCall(false)" title="Telepon">📞</button>
            <button onclick="startCall(true)" title="Video Call">📹</button>
        </div>
    </div>

    <div class="chat-area" id="chat"></div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Ketik pesan...">
        <button onclick="sendMsg()">➤</button>
    </div>

    <!-- Layar Panggilan 1-Klik -->
    <div id="callScreen">
        <iframe id="jitsiFrame" allow="camera; microphone"></iframe>
        <button class="end-call-btn" onclick="endCall()">Tutup Panggilan</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTFek7KpvKg_VnTou4wobBuo7LSqXGEf0",
            authDomain: "whatss-7801f.firebaseapp.com",
            databaseURL: "https://whatss-7801f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "whatss-7801f",
            storageBucket: "whatss-7801f.firebasestorage.app",
            messagingSenderId: "943427416394",
            appId: "1:943427416394:web:e0adf4e31dd094ccd911b3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Identitas File Ini
        const SAYA = "Bal"; 
        const chatRef = ref(db, "chats/ruang_obrolan_kita");
        
        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('msgInput');

        // Terima Pesan Real-time
        onChildAdded(chatRef, (data) => {
            const pesan = data.val();
            const div = document.createElement('div');
            div.className = `msg ${pesan.sender === SAYA ? 'me' : 'them'}`;
            
            const time = new Date(pesan.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            div.innerHTML = `${pesan.text} <span class="msg-time">${time}</span>`;
            
            chatDiv.appendChild(div);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        });

        // Kirim Pesan
        window.sendMsg = function() {
            if (input.value.trim() !== '') {
                push(chatRef, {
                    sender: SAYA,
                    text: input.value.trim(),
                    time: Date.now()
                });
                input.value = '';
            }
        }

        // Tekan Enter untuk kirim
        input.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendMsg();
        });

        // Fitur Telepon & Nada Dering
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playRing() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.connect(audioCtx.destination);
            osc.start();
            setTimeout(() => osc.stop(), 1500); 
        }

        window.startCall = function(isVideo) {
            playRing();
            document.getElementById('callScreen').style.display = 'block';
            const roomName = "RuangRahasiaBalDanDai12345";
            const videoState = isVideo ? "false" : "true";
            document.getElementById('jitsiFrame').src = `https://meet.jit.si/${roomName}#config.startWithVideoMuted=${videoState}`;
        }

        window.endCall = function() {
            document.getElementById('callScreen').style.display = 'none';
            document.getElementById('jitsiFrame').src = "";
        }
    </script>
</body>
</html>
