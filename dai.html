<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp - Dai</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #efeae2; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #008069; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; }
        .header-icons span { cursor: pointer; margin-left: 20px; font-size: 20px; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: cover; background-attachment: fixed; }
        .message { max-width: 75%; padding: 8px 12px; margin-bottom: 10px; border-radius: 8px; font-size: 15px; word-wrap: break-word; position: relative; }
        .message.sent { align-self: flex-end; background-color: #d9fdd3; border-top-right-radius: 0; }
        .message.received { align-self: flex-start; background-color: #ffffff; border-top-left-radius: 0; }
        .message img, .message video { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        .message .time { font-size: 10px; color: #667781; display: block; text-align: right; margin-top: 4px; }
        .input-container { display: flex; padding: 10px; background-color: #f0f2f5; align-items: center; }
        .input-container button { background: none; border: none; font-size: 24px; cursor: pointer; padding: 0 10px; }
        .input-container input[type="text"] { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; outline: none; }
        #video-call-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: #000; }
        #callFrame { width: 100%; height: 100%; border: none; }
        .close-call { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #ff3b30; color: white; padding: 12px 24px; border: none; border-radius: 24px; cursor: pointer; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div>👤 Bal (Kamu: Dai)</div>
        <div class="header-icons">
            <span onclick="startCall('audio')" title="Voice Call">📞</span>
            <span onclick="startCall('video')" title="Video Call">📹</span>
        </div>
    </div>

    <div class="chat-container" id="chat-container"></div>

    <div class="input-container">
        <input type="file" id="fileInput" style="display:none" accept="image/*,video/*">
        <button onclick="document.getElementById('fileInput').click()" title="Kirim foto/video">📎</button>
        <input type="text" id="messageInput" placeholder="Ketik pesan...">
        <button onclick="sendMessage()" style="color:#008069;" title="Kirim">➤</button>
    </div>

    <div id="video-call-container">
        <iframe id="callFrame" allow="camera; microphone; display-capture; autoplay"></iframe>
        <button class="close-call" onclick="endCall()">Tutup Panggilan</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTFek7KpvKg_VnTou4wobBuo7LSqXGEf0",
            authDomain: "whatss-7801f.firebaseapp.com",
            databaseURL: "https://whatss-7801f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "whatss-7801f",
            storageBucket: "whatss-7801f.firebasestorage.app",
            messagingSenderId: "943427416394",
            appId: "1:943427416394:web:e0adf4e31dd094ccd911b3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        const SAYA = "Dai"; 
        const chatRoomRef = ref(db, "chats/room_bal_dai");

        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');

        function formatTime(ts) {
            const d = new Date(ts);
            return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        }

        onChildAdded(chatRoomRef, (snapshot) => {
            const data = snapshot.val();
            const div = document.createElement('div');
            div.className = `message ${data.sender === SAYA ? 'sent' : 'received'}`;
            
            let content = '';
            if (data.type === 'text') {
                content = data.text;
            } else if (data.type === 'image') {
                content = `<img src="${data.url}">`;
            } else if (data.type === 'video') {
                content = `<video src="${data.url}" controls></video>`;
            }

            div.innerHTML = `${content} <span class="time">${formatTime(data.timestamp)}</span>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        window.sendMessage = function() {
            const text = messageInput.value.trim();
            if (text !== '') {
                push(chatRoomRef, { sender: SAYA, type: 'text', text: text, timestamp: Date.now() });
                messageInput.value = '';
            }
        };

        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') window.sendMessage();
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            alert('Mengirim media... Mohon tunggu.');
            const storageRef = sRef(storage, `uploads/${Date.now()}_${file.name}`);
            const uploadTask = uploadBytesResumable(storageRef, file);

            uploadTask.on('state_changed', null, 
                (error) => alert('Gagal upload: ' + error.message), 
                async () => {
                    const url = await getDownloadURL(uploadTask.snapshot.ref);
                    const type = file.type.startsWith('video/') ? 'video' : 'image';
                    push(chatRoomRef, { sender: SAYA, type: type, url: url, timestamp: Date.now() });
                }
            );
        });

        window.startCall = function(type) {
            const isVideo = type === 'video' ? 'false' : 'true';
            document.getElementById('video-call-container').style.display = 'block';
            document.getElementById('callFrame').src = `https://meet.jit.si/RuangKhususBalDai123#config.startWithVideoMuted=${isVideo}`;
        }

        window.endCall = function() {
            document.getElementById('video-call-container').style.display = 'none';
            document.getElementById('callFrame').src = "";
        }
    </script>
</body>
</html>
