<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp - Dai</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111827;
        }
        .chat-bg {
            background-color: #0b141a;
            background-repeat: repeat;
            background-position: center;
            background-size: cover;
        }
        .message-shadow {
            box-shadow: 0 1px 0.5px rgba(11,20,26,.13);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        /* Pulse Animation for Recording */
        @keyframes pulse-red {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.8; }
        }
        .pulse-mic {
            animation: pulse-red 1.2s infinite ease-in-out;
        }
        /* Call Ringing Animation */
        @keyframes ring-pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            70% { box-shadow: 0 0 0 25px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .ring-avatar {
            animation: ring-pulse 1.8s infinite;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-0 md:p-4 bg-slate-900">

    <!-- Main App Container -->
    <div class="w-full max-w-4xl h-full md:h-[92vh] bg-[#111b21] flex flex-col rounded-none md:rounded-2xl overflow-hidden shadow-2xl border border-slate-800 relative">

        <!-- HEADER SECTION -->
        <header class="bg-[#202c33] text-slate-200 px-4 py-3 flex items-center justify-between border-b border-slate-800 z-10 select-none">
            <!-- Left Info (Click to open Settings) -->
            <div onclick="openSettingsModal()" class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity">
                <div class="relative">
                    <img id="partnerHeaderAvatar" src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80" alt="Bal Avatar" class="w-10 h-10 rounded-full object-cover border border-slate-700">
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-[#202c33] rounded-full"></span>
                </div>
                <div>
                    <h2 id="partnerHeaderName" class="font-semibold text-base text-slate-100 leading-tight">Bal</h2>
                    <p class="text-xs text-emerald-400 font-medium">Online • Ketik untuk setel</p>
                </div>
            </div>

            <!-- Header Action Buttons -->
            <div class="flex items-center gap-2 sm:gap-4 text-slate-300">
                <button onclick="initiateCall('voice')" class="p-2.5 hover:bg-slate-700/50 rounded-full transition-colors text-emerald-400" title="Panggilan Suara">
                    <i class="fa-solid fa-phone text-lg"></i>
                </button>
                <button onclick="initiateCall('video')" class="p-2.5 hover:bg-slate-700/50 rounded-full transition-colors text-emerald-400" title="Panggilan Video">
                    <i class="fa-solid fa-video text-lg"></i>
                </button>
                <div class="h-5 w-[1px] bg-slate-700 mx-1"></div>
                <button onclick="openSettingsModal()" class="p-2.5 hover:bg-slate-700/50 rounded-full transition-colors text-slate-300" title="Pengaturan">
                    <i class="fa-solid fa-ellipsis-vertical text-lg"></i>
                </button>
            </div>
        </header>

        <!-- CHAT MESSAGES AREA -->
        <main id="chatMessages" class="flex-1 chat-bg overflow-y-auto p-4 flex flex-col gap-3 relative">
            <div class="text-center my-2">
                <span class="bg-[#182229] text-xs text-amber-300/80 px-3 py-1.5 rounded-lg border border-amber-500/20 shadow-sm inline-flex items-center gap-1.5">
                    <i class="fa-solid fa-lock text-[10px]"></i> Pesan terenkripsi secara otomatis antara Bal & Dai
                </span>
            </div>
            <!-- Dynamic Messages will be injected here -->
        </main>

        <!-- INPUT CHAT BAR -->
        <footer class="bg-[#202c33] p-3 flex items-center gap-2 border-t border-slate-800 z-10 relative">
            
            <!-- Attachment Menu Toggle Button -->
            <div class="relative">
                <button id="attachBtn" onclick="toggleAttachMenu()" class="p-2.5 text-slate-400 hover:text-slate-200 rounded-full hover:bg-slate-700/50 transition-colors">
                    <i class="fa-solid fa-paperclip text-xl"></i>
                </button>

                <!-- Hidden Attach Dropdown -->
                <div id="attachMenu" class="hidden absolute bottom-14 left-0 bg-[#233138] rounded-xl shadow-2xl p-2 flex flex-col gap-1 border border-slate-700/80 w-44 z-30">
                    <label class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-700/60 rounded-lg cursor-pointer text-slate-200 text-sm transition-colors">
                        <i class="fa-solid fa-image text-emerald-400 text-lg w-5"></i>
                        <span>Kirim Foto</span>
                        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    </label>
                    <label class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-700/60 rounded-lg cursor-pointer text-slate-200 text-sm transition-colors">
                        <i class="fa-solid fa-film text-purple-400 text-lg w-5"></i>
                        <span>Kirim Video</span>
                        <input type="file" id="videoInput" accept="video/*" class="hidden" onchange="handleVideoUpload(event)">
                    </label>
                </div>
            </div>

            <!-- Text Input Field -->
            <div class="flex-1 flex items-center bg-[#2a3942] rounded-xl px-4 py-1.5 border border-transparent focus-within:border-emerald-500/50 transition-all">
                <input type="text" id="messageInput" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)" class="w-full bg-transparent text-slate-100 placeholder-slate-400 text-sm outline-none py-1.5">
            </div>

            <!-- Live Voice Note Recording Banner (Hidden by default) -->
            <div id="recordingBanner" class="hidden flex-1 bg-rose-950/40 border border-rose-500/30 rounded-xl px-4 py-2 flex items-center justify-between text-rose-300">
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 bg-rose-500 rounded-full pulse-mic"></span>
                    <span class="text-sm font-medium">Merekam Suara... <span id="recordTimer">00:00</span></span>
                </div>
                <button onclick="cancelVoiceRecording()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md transition-colors">Batal</button>
            </div>

            <!-- Voice Recording Button / Send Button -->
            <div class="flex items-center gap-1">
                <button id="micBtn" onclick="toggleVoiceRecord()" class="p-3 text-slate-300 hover:bg-slate-700/50 rounded-full transition-colors bg-slate-700/30" title="Rekam Voice Note">
                    <i class="fa-solid fa-microphone text-lg" id="micIcon"></i>
                </button>
                <button onclick="sendTextMessage()" class="p-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-full transition-transform active:scale-95 shadow-md" title="Kirim">
                    <i class="fa-solid fa-paper-plane text-base"></i>
                </button>
            </div>
        </footer>

        <!-- MODAL SETTINGS (PENGATURAN) -->
        <div id="settingsModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-[#222e35] text-slate-100 w-full max-w-md rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col">
                <div class="bg-[#111b21] px-5 py-4 flex items-center justify-between border-b border-slate-800">
                    <h3 class="font-semibold text-lg flex items-center gap-2">
                        <i class="fa-solid fa-gear text-emerald-400"></i> Pengaturan Obrolan
                    </h3>
                    <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-100 text-lg p-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="p-5 flex flex-col gap-4 overflow-y-auto max-h-[75vh]">
                    <!-- Identitas Dai (Diri Sendiri) -->
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Foto Profil Dai (Diri Anda)</label>
                        <div class="flex items-center gap-3">
                            <img id="mySettingAvatarPrev" src="" class="w-12 h-12 rounded-full object-cover border border-slate-600">
                            <input type="file" id="myPicUpload" accept="image/*" class="text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600 cursor-pointer">
                        </div>
                    </div>

                    <hr class="border-slate-700/60">

                    <!-- Identitas Bal (Pasangan) -->
                    <div class="space-y-3">
                        <label class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Identitas Bal (Pasangan)</label>
                        <div>
                            <span class="text-xs text-slate-400 mb-1 block">Nama Pasangan:</span>
                            <input type="text" id="partnerNameInput" class="w-full bg-[#111b21] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <span class="text-xs text-slate-400 mb-1 block">Foto Profil Bal:</span>
                            <div class="flex items-center gap-3">
                                <img id="partnerSettingAvatarPrev" src="" class="w-12 h-12 rounded-full object-cover border border-slate-600">
                                <input type="file" id="partnerPicUpload" accept="image/*" class="text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600 cursor-pointer">
                            </div>
                        </div>
                    </div>

                    <hr class="border-slate-700/60">

                    <!-- Custom Wallpaper Background -->
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Custom Background Wallpaper</label>
                        <input type="file" id="bgUpload" accept="image/*" class="text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600 cursor-pointer w-full">
                        <button onclick="resetBackgroundWallpaper()" class="text-xs text-rose-400 hover:underline inline-block mt-1">Gunakan Background Default</button>
                    </div>
                </div>

                <div class="bg-[#111b21] px-5 py-3 flex justify-end gap-2 border-t border-slate-800">
                    <button onclick="closeSettingsModal()" class="px-4 py-2 text-xs font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg transition-colors">Batal</button>
                    <button onclick="saveSettings()" class="px-4 py-2 text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition-colors">Simpan Perubahan</button>
                </div>
            </div>
        </div>

        <!-- CALL OVERLAY (PANGGULAN SUARA / VIDEO) -->
        <div id="callOverlay" class="hidden fixed inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-between p-6 text-slate-100">
            <!-- Top Call Header -->
            <div class="text-center mt-6">
                <span id="callTypeBadge" class="bg-emerald-950/80 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1 rounded-full uppercase tracking-widest font-semibold inline-block mb-3">Panggilan Video</span>
                <h3 id="callPartnerName" class="text-2xl font-bold text-slate-100">Bal</h3>
                <p id="callStatusText" class="text-sm text-slate-400 mt-1">Memanggil...</p>
            </div>

            <!-- Avatar / Video Embed Container -->
            <div id="callMediaArea" class="my-auto flex flex-col items-center justify-center w-full max-w-xl h-64 md:h-96 relative">
                <div id="callAvatarBox" class="flex flex-col items-center">
                    <img id="callAvatarImg" src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80" class="w-32 h-32 md:w-40 md:h-40 rounded-full object-cover border-4 border-emerald-500 ring-avatar shadow-2xl">
                </div>
                <!-- Jitsi Frame when connected -->
                <div id="jitsiContainer" class="hidden w-full h-full rounded-2xl overflow-hidden border border-slate-800 shadow-2xl"></div>
            </div>

            <!-- Call Control Buttons -->
            <div class="mb-6 flex items-center gap-6">
                <!-- Answer Button (Only shown during incoming call) -->
                <button id="answerCallBtn" onclick="answerIncomingCall()" class="hidden w-16 h-16 bg-emerald-600 hover:bg-emerald-500 text-white rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-90 animate-bounce">
                    <i class="fa-solid fa-phone text-2xl"></i>
                </button>

                <!-- End / Reject Call Button -->
                <button onclick="hangUpCall()" class="w-16 h-16 bg-rose-600 hover:bg-rose-500 text-white rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-90" title="Tutup Panggilan">
                    <i class="fa-solid fa-phone-slash text-2xl"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Audio Elements for Notifications -->
    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <audio id="ringtoneSound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" loop preload="auto"></audio>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBTFek7KpvKg_VnTou4wobBuo7LSqXGEf0",
            authDomain: "whatss-7801f.firebaseapp.com",
            databaseURL: "https://whatss-7801f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "whatss-7801f",
            storageBucket: "whatss-7801f.firebasestorage.app",
            messagingSenderId: "943427416394",
            appId: "1:943427416394:web:e0adf4e31dd094ccd911b3"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Path References
        const chatRoomRef = db.ref('chats/room_bal_dai');
        const callRoomRef = db.ref('calls/room_bal_dai');

        // App State
        const MY_NAME = "Dai"; // This file is specifically for Dai
        let partnerName = localStorage.getItem('dai_partner_name') || "Bal";
        let partnerPic = localStorage.getItem('dai_partner_pic') || "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80";
        let myPic = localStorage.getItem('dai_my_pic') || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80";
        let customBg = localStorage.getItem('dai_chat_bg') || "";

        // Voice Recorder State
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordInterval = null;
        let recordSeconds = 0;

        // Call State
        let activeCallData = null;

        window.addEventListener('DOMContentLoaded', () => {
            applySettingsUI();
            requestNotificationPermission();
            listenForMessages();
            listenForCalls();
        });

        function applySettingsUI() {
            document.getElementById('partnerHeaderName').innerText = partnerName;
            document.getElementById('partnerHeaderAvatar').src = partnerPic;
            document.getElementById('partnerSettingAvatarPrev').src = partnerPic;
            document.getElementById('mySettingAvatarPrev').src = myPic;
            document.getElementById('partnerNameInput').value = partnerName;
            
            const chatBox = document.getElementById('chatMessages');
            if(customBg) {
                chatBox.style.backgroundImage = `url('${customBg}')`;
            } else {
                chatBox.style.backgroundImage = "radial-gradient(#1e293b 1px, transparent 0)";
                chatBox.style.backgroundSize = "16px 16px";
            }
        }

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        function listenForMessages() {
            chatRoomRef.on('child_added', snapshot => {
                const msg = snapshot.val();
                renderMessage(msg);
                
                // Sound & Push Notification if message comes from Bal
                if (msg.sender !== MY_NAME) {
                    playNotifSound();
                    if (document.hidden && Notification.permission === "granted") {
                        new Notification(`Pesan dari ${partnerName}`, {
                            body: msg.type === 'text' ? msg.content : `[Menerima ${msg.type}]`,
                            icon: partnerPic
                        });
                    }
                }
            });
        }

        function playNotifSound() {
            const sound = document.getElementById('notifSound');
            sound.currentTime = 0;
            sound.play().catch(e => console.log('Audio autoplay blocked', e));
        }

        function renderMessage(msg) {
            const container = document.getElementById('chatMessages');
            const isMe = msg.sender === MY_NAME;

            const msgWrapper = document.createElement('div');
            msgWrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[82%] sm:max-w-[65%] p-3 rounded-2xl message-shadow relative text-sm ${
                isMe ? 'bg-[#005c4b] text-slate-100 rounded-tr-none' : 'bg-[#202c33] text-slate-100 rounded-tl-none'
            }`;

            let contentHtml = '';

            if (msg.type === 'text') {
                contentHtml = `<p class="whitespace-pre-wrap break-words leading-relaxed">${escapeHtml(msg.content)}</p>`;
            } else if (msg.type === 'image') {
                contentHtml = `
                    <div class="rounded-lg overflow-hidden my-1 bg-black/20">
                        <img src="${msg.content}" class="max-h-64 w-full object-cover cursor-pointer hover:opacity-90 transition-opacity" onclick="window.open('${msg.content}', '_blank')">
                    </div>`;
            } else if (msg.type === 'video') {
                contentHtml = `
                    <div class="rounded-lg overflow-hidden my-1 bg-black">
                        <video src="${msg.content}" controls class="max-h-64 w-full"></video>
                    </div>`;
            } else if (msg.type === 'audio') {
                contentHtml = `
                    <div class="flex items-center gap-2 py-1 min-w-[200px]">
                        <i class="fa-solid fa-circle-play text-emerald-400 text-2xl cursor-pointer hover:scale-105" onclick="this.nextElementSibling.play()"></i>
                        <audio src="${msg.content}" controls class="w-full h-8 max-w-[220px]"></audio>
                    </div>`;
            }

            const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            bubble.innerHTML = `
                ${contentHtml}
                <div class="text-[10px] text-slate-400/80 text-right mt-1 flex items-center justify-end gap-1">
                    <span>${timeStr}</span>
                    ${isMe ? '<i class="fa-solid fa-check-double text-emerald-400 text-[11px]"></i>' : ''}
                </div>
            `;

            msgWrapper.appendChild(bubble);
            container.appendChild(msgWrapper);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function sendTextMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            chatRoomRef.push({
                sender: MY_NAME,
                type: 'text',
                content: text,
                timestamp: Date.now()
            });

            input.value = '';
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter') sendTextMessage();
        }

        function toggleAttachMenu() {
            const menu = document.getElementById('attachMenu');
            menu.classList.toggle('hidden');
        }

        function handleImageUpload(e) {
            toggleAttachMenu();
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                chatRoomRef.push({
                    sender: MY_NAME,
                    type: 'image',
                    content: evt.target.result,
                    timestamp: Date.now()
                });
            };
            reader.readAsDataURL(file);
        }

        function handleVideoUpload(e) {
            toggleAttachMenu();
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                chatRoomRef.push({
                    sender: MY_NAME,
                    type: 'video',
                    content: evt.target.result,
                    timestamp: Date.now()
                });
            };
            reader.readAsDataURL(file);
        }

        async function toggleVoiceRecord() {
            if(!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = function(evt) {
                            chatRoomRef.push({
                                sender: MY_NAME,
                                type: 'audio',
                                content: evt.target.result,
                                timestamp: Date.now()
                            });
                        };
                        reader.readAsDataURL(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    showRecordBanner(true);
                } catch(err) {
                    alert('Tidak dapat mengakses mikrofon. Pastikan Anda mengizinkan mic.');
                }
            } else {
                stopAndSendVoiceRecord();
            }
        }

        function showRecordBanner(show) {
            const banner = document.getElementById('recordingBanner');
            const input = document.getElementById('messageInput');
            const micIcon = document.getElementById('micIcon');

            if(show) {
                banner.classList.remove('hidden');
                input.classList.add('hidden');
                micIcon.className = "fa-solid fa-paper-plane text-emerald-400";
                recordSeconds = 0;
                document.getElementById('recordTimer').innerText = '00:00';
                recordInterval = setInterval(() => {
                    recordSeconds++;
                    const mins = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
                    const secs = String(recordSeconds % 60).padStart(2, '0');
                    document.getElementById('recordTimer').innerText = `${mins}:${secs}`;
                }, 1000);
            } else {
                banner.classList.add('hidden');
                input.classList.remove('hidden');
                micIcon.className = "fa-solid fa-microphone text-lg";
                clearInterval(recordInterval);
            }
        }

        function stopAndSendVoiceRecord() {
            if(mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                showRecordBanner(false);
            }
        }

        function cancelVoiceRecording() {
            if(mediaRecorder && isRecording) {
                mediaRecorder.onstop = null; // Don't send
                mediaRecorder.stop();
                isRecording = false;
                showRecordBanner(false);
            }
        }

        function initiateCall(type) {
            callRoomRef.set({
                caller: MY_NAME,
                status: 'calling',
                type: type,
                room: 'RuangKhususBalDai12345',
                timestamp: Date.now()
            });
        }

        function listenForCalls() {
            callRoomRef.on('value', snapshot => {
                const callData = snapshot.val();
                activeCallData = callData;

                if (!callData || callData.status === 'ended') {
                    closeCallOverlay();
                    return;
                }

                if (callData.status === 'calling') {
                    openCallOverlay(callData);
                } else if (callData.status === 'active') {
                    showConnectedJitsiCall(callData);
                }
            });
        }

        function openCallOverlay(data) {
            const overlay = document.getElementById('callOverlay');
            const isCallerMe = data.caller === MY_NAME;
            const ringtone = document.getElementById('ringtoneSound');

            overlay.classList.remove('hidden');
            document.getElementById('callTypeBadge').innerText = data.type === 'video' ? 'Panggilan Video' : 'Panggilan Suara';
            document.getElementById('callPartnerName').innerText = partnerName;
            document.getElementById('callAvatarImg').src = partnerPic;

            if (isCallerMe) {
                document.getElementById('callStatusText').innerText = 'Memanggil Bal...';
                document.getElementById('answerCallBtn').classList.add('hidden');
                ringtone.play().catch(e => console.log(e));
            } else {
                document.getElementById('callStatusText').innerText = 'Panggilan Masuk dari Bal...';
                document.getElementById('answerCallBtn').classList.remove('hidden');
                ringtone.play().catch(e => console.log(e));

                if (document.hidden && Notification.permission === "granted") {
                    new Notification("Panggilan Masuk!", {
                        body: `Bal memanggil Anda (${data.type})`,
                        icon: partnerPic
                    });
                }
            }
        }

        function answerIncomingCall() {
            callRoomRef.update({ status: 'active' });
        }

        function showConnectedJitsiCall(data) {
            const ringtone = document.getElementById('ringtoneSound');
            ringtone.pause();
            ringtone.currentTime = 0;

            document.getElementById('callStatusText').innerText = 'Terhubung';
            document.getElementById('callAvatarBox').classList.add('hidden');
            
            const jitsiContainer = document.getElementById('jitsiContainer');
            jitsiContainer.classList.remove('hidden');
            jitsiContainer.innerHTML = `
                <iframe src="https://meet.jit.si/${data.room}#userInfo.displayName=%22${MY_NAME}%22" allow="camera; microphone; display-capture; autoplay" class="w-full h-full border-0"></iframe>
            `;
        }

        function hangUpCall() {
            callRoomRef.set({ status: 'ended', timestamp: Date.now() });
        }

        function closeCallOverlay() {
            const overlay = document.getElementById('callOverlay');
            overlay.classList.add('hidden');

            const ringtone = document.getElementById('ringtoneSound');
            ringtone.pause();
            ringtone.currentTime = 0;

            document.getElementById('callAvatarBox').classList.remove('hidden');
            const jitsiContainer = document.getElementById('jitsiContainer');
            jitsiContainer.classList.add('hidden');
            jitsiContainer.innerHTML = '';
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            const newName = document.getElementById('partnerNameInput').value.trim();
            if(newName) {
                partnerName = newName;
                localStorage.setItem('dai_partner_name', partnerName);
            }

            const partnerFile = document.getElementById('partnerPicUpload').files[0];
            if(partnerFile) {
                const r = new FileReader();
                r.onload = e => {
                    partnerPic = e.target.result;
                    localStorage.setItem('dai_partner_pic', partnerPic);
                    applySettingsUI();
                };
                r.readAsDataURL(partnerFile);
            }

            const myFile = document.getElementById('myPicUpload').files[0];
            if(myFile) {
                const r = new FileReader();
                r.onload = e => {
                    myPic = e.target.result;
                    localStorage.setItem('dai_my_pic', myPic);
                    applySettingsUI();
                };
                r.readAsDataURL(myFile);
            }

            const bgFile = document.getElementById('bgUpload').files[0];
            if(bgFile) {
                const r = new FileReader();
                r.onload = e => {
                    customBg = e.target.result;
                    localStorage.setItem('dai_chat_bg', customBg);
                    applySettingsUI();
                };
                r.readAsDataURL(bgFile);
            }

            applySettingsUI();
            closeSettingsModal();
        }

        function resetBackgroundWallpaper() {
            customBg = "";
            localStorage.removeItem('dai_chat_bg');
            applySettingsUI();
        }
    </script>
</body>
</html>
